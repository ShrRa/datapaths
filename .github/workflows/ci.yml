name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run of the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell should not hide the others: a path bug that only shows on
      # Windows is exactly what this matrix is for.
      fail-fast: false
      matrix:
        # Ubuntu alone on a push; all three on a pull request or a manual run.
        #
        # This repo is private, where GitHub bills macOS at 10x and Windows at
        # 2x, so the full matrix costs real money on every commit while Ubuntu
        # costs pennies. A platform bug is worth catching before a merge, not on
        # every intermediate push. Revert to the plain three-OS list once the
        # repo is public and all runners are free.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        # The floor and the ceiling of what pyproject claims, plus one between.
        # 3.10 is here because declaring requires-python >= 3.10 without testing
        # it is a guess.
        python-version: ["3.10", "3.12", "3.14"]

    name: ${{ matrix.os }} / py${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tabular,dev]"

      - name: Run tests
        run: pytest -v

  bare:
    # The tabular extra is optional, so the package must import and its suite
    # must run without pandas or pyarrow -- the parquet/csv tests skip
    # themselves. A stray top-level import of pandas would pass every job above
    # and break a consumer that only resolves paths.
    name: without the tabular extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -c "import datapaths; datapaths.Datapaths"
      - run: pytest -v
